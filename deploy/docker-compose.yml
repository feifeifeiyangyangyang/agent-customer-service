services:
  mysql:
    image: mysql:8.4
    container_name: smart-customer-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_customer_service}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: smart-customer-service-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7.4-alpine
    container_name: smart-customer-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_customer_service}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-at-least-32-chars}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      DEMO_CUSTOMER_USERNAME: ${DEMO_CUSTOMER_USERNAME:-user}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-123456}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v4-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MOCK_ENABLED: ${LLM_MOCK_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_RETRIEVAL_SCORE: ${RAG_MIN_RETRIEVAL_SCORE:-0.35}
      DOCUMENT_STORAGE_PATH: /app/data/documents
      EMBEDDING_MOCK_ENABLED: ${EMBEDDING_MOCK_ENABLED:-true}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
    ports:
      - "8080:8080"
    volumes:
      - document-data:/app/data/documents
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/readiness"]
      interval: 20s
      timeout: 5s
      retries: 10

  document-worker:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.document_worker"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_customer_service}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDING_MOCK_ENABLED: ${EMBEDDING_MOCK_ENABLED:-true}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      DOCUMENT_STORAGE_PATH: /app/data/documents
    volumes:
      - document-data:/app/data/documents
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8088:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql-data:
  qdrant-data:
  redis-data:
  document-data:
